---
layout: page
title: "ALBUMS 3"
description: "archive"
active: gallery
header-img: "img/gallery-bg.jpg"
images:

---

<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/css/selena.css">
</head>

<body class="gallery">
  <section id="content" role="main">
    <div class="wrapper">
      <!-- Page Title -->
      <h2>{{ page.title }}</h2>

      <!-- Gallery Section -->
      <div class="gallery masonry-gallery">
        {% for image in page.images %}
        <figure class="gallery-item">
          <figure class="effect-selena">
            <header class="gallery-icon">
              <a href="{{ site.url }}{{ site.baseurl }}{{ image.gallery-folder }}">
                <img src="{{ site.url }}{{ site.baseurl }}{{ image.image_path }}" alt="{{ image.gallery-name }}">
              </a>
            </header>
            <figcaption class="gallery-caption">
              <div class="entry-summary">
                <h3>{{ image.gallery-name }}</h3>
                <p>{{ image.gallery-date }}</p>
              </div>
            </figcaption>
          </figure>
        </figure>
        {% endfor %}
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="{{ site.baseurl }}/js/retina.min.js"></script>
  <script src="{{ site.baseurl }}/js/isotope.pkgd.min.js"></script>
  <script src="{{="{{ site.baseurl }}/js/jquery.tinycarousel.min.js"></script>
  <script src="{{ site.baseurl }}/js/jquery.lazylinepainter.min.js"></script>
  <script src="{{ site.baseurl }}/js/scripts.js"></script>
  <script src="{{ site.baseurl }}/js/modernizr.js"></script>
</body>
</html>
